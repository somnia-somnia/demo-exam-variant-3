<g font-size="14"><text x="330" y="200">1 → 0..N</text><text x="710" y="200">1 → 0..1</text><text x="40" y="452">Все поля NOT NULL. Один пользователь создаёт много заявок; одна заявка получает не более одного отзыва.</text><text x="40" y="478">Владельца отзыва определяет заявка. PRAGMA foreign_keys = ON на каждом соединении приложения.</text></g></g></svg>
