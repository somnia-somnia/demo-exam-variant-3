<text x="40" y="45" font-size="25" font-weight="bold">Ключ.на.старт · ER-диаграмма</text>
<text x="40" y="76" font-size="15">PK — первичный ключ · FK — внешний ключ · UK — уникальное значение</text>
<g fill="white" stroke="#212b36" stroke-width="1.5"><rect x="40" y="115" width="280" height="295" rx="12"/><rect x="420" y="115" width="280" height="295" rx="12"/><rect x="800" y="115" width="280" height="230" rx="12"/></g>
<g fill="#d9480f" font-size="21" font-weight="bold"><text x="60" y="152">users</text><text x="440" y="152">bookings</text><text x="820" y="152">reviews</text></g>
<g font-size="16"><text x="60" y="189">id INTEGER · PK</text><text x="60" y="220">login TEXT · UK, NOCASE</text><text x="60" y="251">password_hash TEXT</text><text x="60" y="282">full_name TEXT</text><text x="60" y="313">phone TEXT</text><text x="60" y="344">email TEXT</text><text x="60" y="375">is_admin INTEGER</text>
